# The walkthrough in the web app's welcome pop-up, shown after signing in.
# The app adds the first page ("Welcome") and the last page ("Start using CasaZapp TV now") itself;
# these are the pages in between, in this order. Change a line, commit, and the app follows in about
# a minute (it reads https://casazapp.tv/welcome/pages.json).
#
# Each page:
#   title: short, one line
#   text:  one or two sentences
#   image: a file in assets/welcome/ (e.g. assets/welcome/watch-1.png) or a full https:// address.
#          Any size works; the pop-up shows it in a fixed 16:10 frame. 1600x1000 looks sharpest.
#
# Example (remove the # to use it):
# - title: Watch a TV channel
#   text: Open TV Channels and pick a channel. Zap with the arrow keys.
#   image: assets/welcome/watch-1.png

pages:
  - title: Overview
    text: Quick access to your live TV, movies, and series. Jump straight into your favorites or pick up right where you left off.
    image: assets/welcome/00-homepage.png

  - title: Live TV & Guide
    text: Browse the guide and pick a channel to start watching.
    image: assets/welcome/01-open-tv-channel.png

  - title: Quick Search
    text: Know what you want? Use the search bar to find channels and shows instantly.
    image: assets/welcome/01-2-open-tv-channel-search.png 
    
  - title: Record Live TV
    text: See something good? Hit the record button directly in the player to save it to your server.
    image: assets/welcome/02-start-recording-tv-channel.png 
    
  - title: Schedule Recordings
    text: Plan ahead. Select upcoming shows in the guide to record them automatically.
    image: assets/welcome/03-start-recording-tv-guide.png

  - title: Watch Anytime
    text: All your finished recordings are safely stored and ready to play from the sidebar.
    image: assets/welcome/04-play-recording.png    

  - title: Personal Profiles
    text: Share your server without messing up your watch history. Add new users in the settings.
    image: assets/welcome/05-create-profile.png

  - title: Switch Users
    text: Quickly change who is watching directly from the dashboard.
    image: assets/welcome/06-switch-profile-option.png

  - title: Profile Overview
    text: Easy switch to the preferred profile.
    image: assets/welcome/07-switch-profile-screen.png

  - title: PIN Protection
    text: Keep the kids out or protect your privacy by locking profiles with an optional PIN.
    image: assets/welcome/08-switch-profile-pin.png

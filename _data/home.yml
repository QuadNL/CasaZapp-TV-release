steps_title: How it works
steps:
  - title: Run the server
    text: One Docker container on a NAS, a small Linux box or a Raspberry Pi. It keeps your playlists, fetches the guide and records.
  - title: Add your playlist
    text: Sign in from a browser and add your Xtream or M3U playlist. Pick the channels and categories you want.
  - title: Pair your screens
    text: Install the app on your Google TV or Android phone and pair it with a code. Or just use the web app.

compare_title: With or without a server
compare_text: The Android app also works on its own, with a playlist on the device. A server adds the rest.

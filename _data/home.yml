install_title: Install
install_text: >-
  The server is a single docker-compose.yml. Just make sure you have enough space available for recordings.

faq_title: Questions
faq:
  - q: Does it come with channels?
    a: No. CasaZapp TV is a player. You add a playlist from a provider you pay for, or from a legal free source.
  - q: Can I try it without a subscription?
    a: Yes. Add the demo playlist from this repository (demo/playlist.m3u) — made-up channels with a test video and a guide.
  - q: Which devices does the app run on?
    a: Google TV, Chromecast with Google TV, Android TV boxes, and Android phones and tablets. Everything else uses the web app in the browser.
  - q: Does my stream go through the server?
    a: By default the server passes the stream on, which works everywhere. The app can also play straight from the provider, so the stream skips your server.
  - q: Is it open source?
    a: No. The app and the server are free to use at home; the source code is not public.


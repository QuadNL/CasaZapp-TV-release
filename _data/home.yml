# The texts of the home page. Change a line, commit, and the site follows in about a minute.
# Keep the indentation (two spaces) and the dashes; text with a colon in it goes between quotes.

hero:
  title: Your own TV player,<br>on your own server.
  text: >-
    CasaZapp TV gives you the best set-topbox experience you want. It runs on docker, so your
    channel lists, favourites, recordings and watch history stay with you in sync across all your devices.

  note: Free without any ads. 
  # The picture beside the title (a TV and a phone), in assets.
  image: hero.png

# The download buttons. Leave "link" empty to show "Coming soon".
downloads:
  - label: Android app
    link: "https://github.com/QuadNL/CasaZapp-TV-release/releases/latest"
    primary: true
  - label: Docker image
    link: "https://quadnl.github.io/CasaZapp-TV-release/docs/server.html"

features_title: Everything a TV at home needs
features:
  - title: Live TV with a guide
    text: Zap with the remote, see what's on now and next, search channels and programmes across the whole guide.
  - title: Films and series
    text: Browse what your provider offers, continue where you stopped on any screen, keep a watchlist.
  - title: Pause and record
    text: Pause live TV and pick it up later. Record a programme from the guide, or a set time; it plays back without a provider connection.
  - title: Profiles
    text: Everyone at home gets their own favourites, lists, history and watchlist, with a PIN if you like and limits for the kids.
  - title: Knows your connections
    text: Your provider allows a number of streams. CasaZapp TV counts them, asks before taking one over, and shows who's watching what.
  - title: Works without the server too
    text: The Android app can also run standalone, with a playlist on the device. Handy on the road.


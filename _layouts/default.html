<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  {% if page.url == "/" %}
  <title>{{ site.title }} — {{ site.description }}</title>
  {% else %}
  <title>{{ page.title | default: site.title }} — {{ site.title }}</title>
  {% endif %}
  <meta name="description" content="CasaZapp TV plays the IPTV subscription you already have, from a server at home: live TV with a guide, films and series, recordings, profiles, and an app for Google TV and Android.">
  <link rel="icon" href="{{ '/assets/favicon.svg' | relative_url }}" type="image/svg+xml">
  <meta property="og:title" content="{{ page.title | default: site.title }}">
  <meta property="og:description" content="{{ site.description }}">
  <meta property="og:image" content="{{ '/assets/icon.png' | absolute_url }}">
  <link rel="stylesheet" href="{{ '/assets/style.css' | relative_url }}">
</head>
<body>
  <!-- The opening animation, as in the web app: once per visit. -->
  <div class="splash" role="presentation" hidden>
    <div class="splash-logo">
      <svg viewBox="0 0 32 32" width="80" height="80" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#FFB547"/>
        <path class="splash-house" d="M16 6.5 6.5 14.2V25a1.5 1.5 0 0 0 1.5 1.5h16a1.5 1.5 0 0 0 1.5-1.5V14.2z" fill="none" stroke="#1C1305" stroke-width="2.2" stroke-linejoin="round"/>
        <path class="splash-play" d="M13.6 15.4v7.2l6-3.6z" fill="#1C1305"/>
      </svg>
      <span class="splash-word">CasaZapp TV</span>
    </div>
  </div>
  <script>
    (function () {
      var el = document.querySelector('.splash');
      try { if (sessionStorage.getItem('splash-seen') === '1') return; sessionStorage.setItem('splash-seen', '1'); } catch (e) {}
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      el.hidden = false;
      setTimeout(function () { el.remove(); }, 1600);
    })();
  </script>
  <header class="top">
    <div class="wrap top-row">
      <a class="brand" href="{{ '/' | relative_url }}">
        <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><use href="#logo"/></svg>
        <span>CasaZapp TV</span>
      </a>
      <nav class="links" aria-label="Site">
        <a href="{{ '/#features' | relative_url }}">Features</a>
        <a href="{{ '/#screens' | relative_url }}">Showcase</a>
        <a href="{{ '/docs/server.html' | relative_url }}">Guides</a>
        <a href="{{ site.repo }}">GitHub</a>
      </nav>
    </div>
  </header>

  <main>
    {{ content }}
  </main>

  <footer class="foot">
    <div class="wrap foot-row">
      <span>CasaZapp TV</span>
      <span class="muted">{{ site.data.home.footer }}</span>
      <span class="foot-links">
        <a href="{{ '/CHANGELOG.html' | relative_url }}">Changelog</a>
        <a href="{{ site.repo }}/issues/new/choose">Report an issue</a>
      </span>
    </div>
  </footer>

  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <symbol id="logo" viewBox="0 0 32 32">
      <rect width="32" height="32" rx="8" fill="#FFB547"/>
      <path d="M16 6.5 6.5 14.2V25a1.5 1.5 0 0 0 1.5 1.5h16a1.5 1.5 0 0 0 1.5-1.5V14.2z" fill="none" stroke="#1C1305" stroke-width="2.2" stroke-linejoin="round"/>
      <path d="M13.6 15.4v7.2l6-3.6z" fill="#1C1305"/>
    </symbol>
  </svg>
</body>
</html>
